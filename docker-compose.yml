services:
  postgres:
    image: postgres:17-alpine
    container_name: giveaway-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-giveaway}
      POSTGRES_USER: ${DB_USER:-giveaway_app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-giveaway_secret_dev}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - giveaway-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-giveaway_app} -d ${DB_NAME:-giveaway}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  giveaway-pgdata:
    driver: local
