spring.application.name=campus-giveaway
server.port=8080
spring.main.allow-bean-definition-overriding=true

# Local secrets: read KEY=value pairs from the repo-root .env (never committed). Real env vars win.
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

# Relational Database Persistence
# Default: Local Docker PostgreSQL on port 5433 (run via `docker compose up -d`)
# Can also be overridden by environment variables (e.g. in Cloud Run for Cloud SQL)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/giveaway}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:giveaway_app}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:giveaway_secret_dev}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# GCP Defaults (disabled by default for zero-friction local development)
spring.cloud.gcp.project-id=${GCP_PROJECT:campus-giveaway-devfest}
spring.cloud.gcp.firestore.enabled=${SPRING_CLOUD_GCP_FIRESTORE_ENABLED:false}
spring.cloud.gcp.storage.enabled=${SPRING_CLOUD_GCP_STORAGE_ENABLED:false}
spring.cloud.gcp.firestore.project-id=${GCP_PROJECT:campus-giveaway-devfest}
spring.cloud.gcp.storage.project-id=${GCP_PROJECT:campus-giveaway-devfest}
app.storage.photo-bucket=${PHOTO_BUCKET:campus-giveaway-devfest-photos}
app.storage.local-dir=uploads

# File Upload Limits
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# AI Vision Auto-fill (Gemini 2.5 Flash)
giveaway.ai.autofill.enabled=${GIVEAWAY_AI_AUTOFILL_ENABLED:true}
gemini.api.key=${GEMINI_API_KEY:}


# Authentication
# Signing secret for email/password session tokens (set AUTH_TOKEN_SECRET; random per start if unset)
giveaway.auth.token-secret=${AUTH_TOKEN_SECRET:}
# Google Sign-In OAuth client ID (public value; Google ID tokens must be issued for this audience)
giveaway.auth.google.client-id=${GOOGLE_CLIENT_ID:775547836512-89bj4b05013a1l37sctmi7ech0ike9gj.apps.googleusercontent.com}
# Comma-separated emails that get ADMIN when signing in with a verified Google account
giveaway.auth.admin-emails=${ADMIN_EMAILS:}
# Admin account created at startup (credentials come from .env / Secret Manager only)
giveaway.admin.email=${ADMIN_EMAIL:}
giveaway.admin.password=${ADMIN_PASSWORD:}
giveaway.admin.name=${ADMIN_NAME:Admin}
