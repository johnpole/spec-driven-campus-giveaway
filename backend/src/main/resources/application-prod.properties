# Production Profile: Google Cloud SQL (PostgreSQL 17) & GCS Media Storage
spring.application.name=campus-giveaway

# Cloud SQL PostgreSQL 17 via Google Socket Factory
spring.datasource.url=jdbc:postgresql:///${DB_NAME:giveaway}?cloudSqlInstance=${CLOUD_SQL_CONNECTION_NAME}&socketFactory=com.google.cloud.sql.postgres.SocketFactory
spring.datasource.username=${DB_USER:giveaway_app}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# GCP Cloud Storage Configuration
spring.cloud.gcp.project-id=${GCP_PROJECT:gdg-hudson}
spring.cloud.gcp.firestore.enabled=false
spring.cloud.gcp.storage.enabled=true
spring.cloud.gcp.storage.project-id=${GCP_PROJECT:gdg-hudson}
app.storage.photo-bucket=${PHOTO_BUCKET:gdg-hudson-campusgiveaway-photos}
app.storage.local-dir=/tmp/uploads

# Health & Actuator Endpoints for Cloud Run Liveness/Readiness
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true

# Seed Data: Strictly disabled in production
giveaway.seed.enabled=false
