spring.application.name=campus-giveaway-test
spring.cloud.gcp.project-id=test-project
spring.cloud.gcp.firestore.enabled=false
spring.cloud.gcp.storage.enabled=false
spring.main.allow-bean-definition-overriding=true

# Test Database Persistence: In-memory H2 with PostgreSQL compatibility mode
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# Auth: deterministic test tokens are allowed ONLY in tests
giveaway.auth.allow-test-tokens=true
giveaway.auth.admin-emails=admin@campus-giveaway.test
giveaway.auth.token-secret=test-secret-for-unit-tests-only
giveaway.admin.email=
